<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>作文稿紙（直式）</title>
<style>
  :root{
    --red: #c0392b;
    --red-faint: #e8b4ac;
    --paper: #fffdf8;
    --ink: #2b2b2b;
    --cell-mm: 8mm;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:#d8d2c4;
    font-family: "PMingLiU","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC",serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 12px 60px;
  }

  /* ---------- 工具列（不列印） ---------- */
  .toolbar{
    width:100%;
    max-width:960px;
    background:#2b2b2b;
    color:#f4f1ea;
    border-radius:10px;
    padding:14px 18px;
    margin-bottom:20px;
    display:flex;
    flex-wrap:wrap;
    gap:10px 16px;
    align-items:flex-end;
    font-family: system-ui, -apple-system, sans-serif;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .toolbar .field{ display:flex; flex-direction:column; gap:4px; font-size:12px; color:#c9c4b8;}
  .toolbar input[type=number]{
    width:64px; padding:6px 8px; border-radius:6px; border:1px solid #555;
    background:#3a3a3a; color:#f4f1ea; font-size:14px;
  }
  .toolbar button{
    padding:8px 16px; border-radius:6px; border:none; cursor:pointer;
    font-size:13px; font-weight:600; font-family:inherit;
  }
  .btn-primary{ background:var(--red); color:#fff; }
  .btn-primary:hover{ background:#a5301f; }
  .btn-secondary{ background:#4a4a4a; color:#f4f1ea; }
  .btn-secondary:hover{ background:#5c5c5c; }
  .toolbar .hint{
    flex-basis:100%; font-size:11.5px; color:#9c9789; line-height:1.6; margin-top:4px;
  }

  /* ---------- 紙張（每頁一張） ---------- */
  #pages{ display:flex; flex-direction:column; gap:24px; align-items:center; }
  .paper{
    background:var(--paper);
    width:297mm;
    max-width:100%;
    padding:10mm 14mm;
    box-shadow:0 6px 24px rgba(0,0,0,.3);
  }
  .head{
    display:flex;
    align-items:flex-end;
    gap:14px;
    border-bottom:2px solid var(--red);
    padding-bottom:10px;
    margin-bottom:14px;
  }
  .head .title-box{ flex:1; display:flex; align-items:center; gap:8px; }
  .head .title-box label{ font-size:13px; color:var(--red); white-space:nowrap; letter-spacing:2px;}
  .head .title-box input{
    flex:1; font-size:20px; border:none; border-bottom:1px dashed var(--red-faint);
    background:transparent; padding:4px 6px; font-family:inherit; color:var(--ink);
    text-align:center; letter-spacing:4px;
  }
  .head .meta{ display:flex; gap:10px; }
  .head .meta .field{ display:flex; align-items:center; gap:4px; }
  .head .meta label{ font-size:11px; color:#888; }
  .head .meta input{
    width:64px; border:none; border-bottom:1px solid #ccc; background:transparent;
    font-family:inherit; font-size:13px; text-align:center; padding:2px 0;
  }
  .page-badge{
    display:flex; justify-content:flex-end; font-size:11px; color:#999; margin-bottom:6px;
  }

  /* ---------- 直式格線：由右至左排欄，欄內由上至下 ---------- */
  .body-wrap{ display:flex; justify-content:center; }
  .grid-body{
    display:flex;
    flex-direction:row;
    padding-top:1px;
    padding-left:1px;
  }
  .column{
    display:flex;
    flex-direction:column;
    margin-left:-1px;
  }
  .cell{
    width:var(--cell-mm);
    aspect-ratio:1/1;
    border:1px solid var(--red);
    margin-top:-1px;
    text-align:center;
    font-size: calc(var(--cell-mm) * 0.5);
    font-family:inherit;
    color:var(--ink);
    background:transparent;
    padding:0;
    outline:none;
    caret-color:var(--red);
    min-width:0;
  }
  .cell:focus{ background:#fdf0d5; }

  .footer{
    margin-top:8px;
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:#999;
  }
  #globalCount{
    width:100%; max-width:960px; text-align:center; font-size:12px; color:#6b6b6b; margin-bottom:4px;
  }

  @media print{
    body{ background:#fff; padding:0; }
    .toolbar, #globalCount{ display:none !important; }
    #pages{ gap:0; }
    .paper{ box-shadow:none; width:auto; padding:6mm 8mm; page-break-after:always; }
    .paper:last-child{ page-break-after:auto; }
    @page{ size:A4 landscape; margin:8mm; }
  }
</style>
</head>
<body>

  <div class="toolbar no-print">
    <div class="field">
      <label>每欄字數（直）</label>
      <input type="number" id="rowsPerCol" value="20" min="5" max="35">
    </div>
    <div class="field">
      <label>每頁欄數（橫）</label>
      <input type="number" id="colsPerPage" value="28" min="5" max="45">
    </div>
    <div class="field">
      <label>格子大小（mm）</label>
      <input type="number" id="cellsize" value="8" min="5" max="15" step="0.5">
    </div>
    <button class="btn-secondary" id="rebuild">重新建立（回到第1頁）</button>
    <button class="btn-secondary" id="addPageBtn">手動新增一頁</button>
    <button class="btn-secondary" id="clearAll">清空作答</button>
    <button class="btn-primary" id="printBtn">列印 / 輸出 PDF</button>
    <div class="hint">
      書寫方向為傳統直式：每欄由上至下填字，一欄填滿後自動跳到「左邊」下一欄；欄用完後會自動新增下一頁繼續書寫。
      點格子可直接選取；輸入一字（可用手寫輸入法）自動下移一格；空白鍵留白並下移一格；欄底按 Enter 直接跳到下一欄開頭；方向鍵可上下（同欄）、左右（跨欄）移動；Backspace 於空格時會退回上一格。
      寫完後按「列印 / 輸出 PDF」，於列印視窗的印表機選擇「另存為 PDF」即可，各頁會自動分頁列印。
    </div>
  </div>

  <div id="globalCount">總計已填字數：0 / 0（共 1 頁）</div>
  <div id="pages"></div>

<script>
(function(){
  const pagesEl = document.getElementById('pages');
  const rowsInput = document.getElementById('rowsPerCol');   // 每欄字數
  const colsInput = document.getElementById('colsPerPage');  // 每頁欄數
  const cellsizeInput = document.getElementById('cellsize');
  const globalCountEl = document.getElementById('globalCount');

  let ROWS = parseInt(rowsInput.value, 10);   // 每欄字數（欄高）
  let COLS = parseInt(colsInput.value, 10);   // 每頁欄數
  let CELLMM = parseFloat(cellsizeInput.value) || 8;

  let cells = [];      // 全域「閱讀順序」flat 陣列：頁1(欄0上→下,欄1上→下,...) , 頁2...
  let pageCount = 0;

  function setCellMM(mm){
    document.documentElement.style.setProperty('--cell-mm', mm + 'mm');
  }

  function buildPage(pageNumber){
    const paper = document.createElement('div');
    paper.className = 'paper';

    if(pageNumber === 1){
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = `
        <div class="title-box">
          <label>題目</label>
          <input type="text" id="topic" placeholder="請輸入作文題目">
        </div>
        <div class="meta">
          <div class="field"><label>班級</label><input type="text"></div>
          <div class="field"><label>座號</label><input type="text"></div>
          <div class="field"><label>姓名</label><input type="text"></div>
        </div>`;
      paper.appendChild(head);
    } else {
      const badge = document.createElement('div');
      badge.className = 'page-badge';
      badge.textContent = `第 ${pageNumber} 頁`;
      paper.appendChild(badge);
    }

    const bodyWrap = document.createElement('div');
    bodyWrap.className = 'body-wrap';
    const gridBody = document.createElement('div');
    gridBody.className = 'grid-body';
    bodyWrap.appendChild(gridBody);
    paper.appendChild(bodyWrap);

    const footer = document.createElement('div');
    footer.className = 'footer';
    footer.innerHTML = `<span>第 ${pageNumber} 頁</span><span>每欄 ${ROWS} 字 × 每頁 ${COLS} 欄</span>`;
    paper.appendChild(footer);

    // 依「閱讀欄序」c = 0..COLS-1（c=0 為最右欄，最先填寫）建立每欄的輸入格，
    // 但 DOM 附加順序需為視覺由左至右（v = COLS-1-c 由小到大附加），
    // 這樣一般（非反向）flex 排列即可讓 c=0 顯示在最右邊。
    const colDoms = new Array(COLS);
    for(let v = 0; v < COLS; v++){
      const c = COLS - 1 - v;
      const col = document.createElement('div');
      col.className = 'column';
      colDoms[c] = col;
    }
    for(let v = 0; v < COLS; v++){
      const c = COLS - 1 - v;
      gridBody.appendChild(colDoms[c]);
    }

    const pageCells = [];
    for(let c = 0; c < COLS; c++){
      const col = colDoms[c];
      for(let r = 0; r < ROWS; r++){
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.maxLength = 2;
        inp.className = 'cell';
        inp.autocomplete = 'off';
        col.appendChild(inp);
        pageCells.push(inp);
      }
    }

    pagesEl.appendChild(paper);
    return pageCells;
  }

  function addPage(){
    pageCount += 1;
    const pageCells = buildPage(pageCount);
    const startIdx = cells.length;
    pageCells.forEach((inp, i)=>{
      const idx = startIdx + i;
      inp.dataset.i = idx;
      attachHandlers(inp, idx);
      cells.push(inp);
    });
    updateGlobalCount();
    return startIdx;
  }

  function focusCell(idx){
    if(idx < 0) return;
    while(idx >= cells.length){
      addPage();
    }
    cells[idx].focus();
    cells[idx].select();
  }

  function updateGlobalCount(){
    const filled = cells.filter(c=>c.value.trim().length>0).length;
    globalCountEl.textContent = `總計已填字數：${filled} / ${cells.length}（共 ${pageCount} 頁）`;
  }

  function attachHandlers(inp, idx){
    inp.addEventListener('input', ()=>{
      if(inp.value.length > 1){
        inp.value = inp.value.slice(-1);
      }
      updateGlobalCount();
      if(inp.value.length === 1){
        focusCell(idx+1);
      }
    });

    inp.addEventListener('keydown', (e)=>{
      if(e.key === ' '){
        e.preventDefault();
        inp.value = '';
        updateGlobalCount();
        focusCell(idx+1);
      } else if(e.key === 'Backspace' && inp.value === ''){
        e.preventDefault();
        if(idx-1 >= 0){
          cells[idx-1].value = '';
          updateGlobalCount();
          focusCell(idx-1);
        }
      } else if(e.key === 'Enter'){
        e.preventDefault();
        const nextColStart = (Math.floor(idx/ROWS)+1)*ROWS;
        focusCell(nextColStart);
      } else if(e.key === 'ArrowDown'){
        e.preventDefault(); if(idx+1 < cells.length || (idx+1)%ROWS!==0) focusCell(idx+1);
      } else if(e.key === 'ArrowUp'){
        e.preventDefault(); if(idx>0) focusCell(idx-1);
      } else if(e.key === 'ArrowLeft'){
        e.preventDefault(); focusCell(idx+ROWS);   // 往左＝往下一欄（閱讀方向前進）
      } else if(e.key === 'ArrowRight'){
        e.preventDefault(); if(idx-ROWS>=0) focusCell(idx-ROWS); // 往右＝往前一欄
      }
    });

    inp.addEventListener('click', ()=> focusCell(idx));
  }

  function resetAll(){
    pagesEl.innerHTML = '';
    cells = [];
    pageCount = 0;
    addPage();
    focusCell(0);
  }

  document.getElementById('rebuild').addEventListener('click', ()=>{
    const r = Math.max(5, Math.min(35, parseInt(rowsInput.value,10) || 20));
    const c = Math.max(5, Math.min(45, parseInt(colsInput.value,10) || 28));
    const m = Math.max(5, Math.min(15, parseFloat(cellsizeInput.value) || 8));
    const hasContent = cells.some(cell=>cell.value.trim().length>0);
    if(hasContent && !confirm('重新建立格線會清除目前所有頁面的內容，確定要繼續嗎？')) return;
    ROWS = r; COLS = c; CELLMM = m;
    setCellMM(CELLMM);
    resetAll();
  });

  document.getElementById('addPageBtn').addEventListener('click', ()=>{
    const startIdx = addPage();
    focusCell(startIdx);
  });

  document.getElementById('clearAll').addEventListener('click', ()=>{
    if(!confirm('確定要清空所有頁面已填寫的文字嗎？')) return;
    cells.forEach(c=>c.value='');
    updateGlobalCount();
    focusCell(0);
  });

  document.getElementById('printBtn').addEventListener('click', ()=>{
    window.print();
  });

  setCellMM(CELLMM);
  resetAll();
})();
</script>
</body>
</html>
